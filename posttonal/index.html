<meta charset="utf-8">
<title>Forte Set Finder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky tab bar; set tabs put the pc clock beside the results, matrix and list use the full width. */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --line: #dde1ea;
  --fg: #171b26;
  --muted: #5b6375;
  --accent: #2b52c9;
  --accent-soft: #e4eaff;
  --accent-fg: #ffffff;
  --warn: #9a5b00;
  --key-white: #ffffff;
  --key-black: #1c2030;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141b; --surface: #191d27; --line: #2c3240; --fg: #e7e9ef; --muted: #9aa2b5;
    --accent: #87a3ff; --accent-soft: #232c4a; --accent-fg: #0d1020; --warn: #e3a74f; color-scheme: dark;
    --key-white: #dfe2ea; --key-black: #07080c;
  }
}
:root[data-theme="dark"] {
  --bg: #11141b; --surface: #191d27; --line: #2c3240; --fg: #e7e9ef; --muted: #9aa2b5;
  --accent: #87a3ff; --accent-soft: #232c4a; --accent-fg: #0d1020; --warn: #e3a74f; color-scheme: dark;
  --key-white: #dfe2ea; --key-black: #07080c;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font: 700 clamp(26px, 6vw, 34px)/1.1 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 small { display: block; font: 500 13px/1.4 var(--body); color: var(--muted); letter-spacing: 0; margin-top: 4px; }
h2 { font: 700 18px/1.2 var(--display); margin: 0; }
h3 { font: 700 15px/1.3 var(--display); margin: 0; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 10px; font-size: 13px; font-family: var(--mono); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  overflow-x: auto;
}
.tabs button { flex: 1 0 auto; border: 0; background: none; border-radius: 9px; padding: 8px 6px; font-weight: 600; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }

.main { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 780px) { .main:not(.solo) { grid-template-columns: minmax(260px, 310px) 1fr; align-items: start; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; min-width: 0; align-content: start; }

.entry { display: grid; gap: 6px; }
.entry input, .field {
  width: 100%; font: 500 18px var(--mono); padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg);
}
.entry input:focus, .field:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.entry-row { display: flex; gap: 8px; flex-wrap: wrap; }
.entry-row input { flex: 1 1 160px; min-width: 0; }
.play { flex: none; border: 0; border-radius: 10px; padding: 0 14px; min-height: 44px; background: var(--accent); color: var(--accent-fg); font-weight: 600; font-size: 14px; }
.play:disabled { opacity: .45; cursor: default; }
.err { font-size: 13px; color: var(--warn); min-height: 1.2em; margin: 0; }

.clock { width: 100%; max-width: 260px; aspect-ratio: 1; justify-self: center; display: block; touch-action: manipulation; }
.clock .ring { fill: none; stroke: var(--line); stroke-width: 1.5; }
.clock .poly { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.clock .node circle { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; transition: fill .12s; }
.clock .node text { fill: var(--fg); font: 500 15px var(--mono); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.clock .node.on circle { fill: var(--accent); stroke: var(--accent); }
.clock .node.on text { fill: var(--accent-fg); }
.clock .node { cursor: pointer; }
.clock .node:focus-visible circle { stroke: var(--fg); stroke-width: 2.5; }
.clock .node:focus { outline: none; }
.clock .nname { fill: var(--muted); font: 500 11px var(--body); text-anchor: middle; dominant-baseline: central; pointer-events: none; }

.ops { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 12px;
  font-size: 13px; font-family: var(--mono);
}
.chip:hover { border-color: var(--accent); }
.chip.ghost { font-family: var(--body); color: var(--muted); }

.result-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 18px; }
.forte-name { font: 700 clamp(44px, 12vw, 64px)/0.95 var(--display); letter-spacing: -0.02em; color: var(--accent); }
.prime-big { font: 500 clamp(22px, 5.5vw, 28px)/1.1 var(--mono); }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }

.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px 18px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-family: var(--mono); font-size: 15.5px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.facts dd .sub { font-family: var(--body); font-size: 12.5px; color: var(--muted); }
.facts .wide { grid-column: 1 / -1; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; text-decoration: underline; text-underline-offset: 3px; }

.icv { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; max-width: 280px; }
.icv span { display: grid; text-align: center; border: 1px solid var(--line); border-radius: 6px; padding: 3px 0; font-family: var(--mono); }
.icv span b { font-weight: 500; font-size: 17px; }
.icv span i { font-style: normal; font-size: 10px; color: var(--muted); }

.related { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.rel { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; background: var(--bg); min-width: 0; }
.rel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.rel-name { font: 700 26px/1 var(--display); color: var(--accent); }
.rel .facts { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px 14px; }
.rel .facts dd { font-size: 14.5px; }

.group { display: grid; gap: 8px; }
.group + .group { border-top: 1px solid var(--line); padding-top: 12px; }
.group-title { display: flex; gap: 8px; align-items: baseline; }
.sclist { display: flex; flex-wrap: wrap; gap: 6px; }
.sc { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 4px 9px; font: 13px var(--mono); display: inline-flex; gap: 6px; align-items: baseline; }
.sc b { font-family: var(--body); font-weight: 600; color: var(--accent); }
.sc i { font-style: normal; color: var(--muted); font-size: 12px; }
.sc:hover { border-color: var(--accent); }
details.group summary { cursor: pointer; list-style-position: inside; }
details.group[open] summary { margin-bottom: 8px; }

.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; font-size: 14px; }

.forms { width: 100%; }
.forms th, .forms td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.forms th { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.forms td.op { font: 500 13px var(--mono); color: var(--muted); width: 1%; }
.forms td.f { cursor: pointer; font-family: var(--mono); }
.forms td.f:hover { background: var(--accent-soft); }
.forms td.f small { display: block; font: 11.5px var(--body); color: var(--muted); }
.forms td.same { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }

.piano-panel { grid-column: 1 / -1; gap: 10px; }
.piano-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.hold { flex: 1 1 240px; min-width: 0; display: grid; gap: 6px; }
.hold-text { font-size: 14px; min-height: 1.5em; overflow-wrap: anywhere; }
.hold-text b { color: var(--accent); font: 700 17px var(--display); }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); }
.piano-tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.oct { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; width: 34px; height: 34px; }
.oct-label { font: 500 13px var(--mono); min-width: 62px; text-align: center; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.chip.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-family: var(--body); font-weight: 600; }
.piano { position: relative; height: clamp(130px, 28vw, 190px); display: flex; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.wk {
  flex: 1; position: relative; margin-right: -1px; background: var(--key-white); border: 1px solid var(--line);
  border-radius: 0 0 7px 7px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
  gap: 2px; padding-bottom: 6px; font: 10px var(--body); color: #5b6375; cursor: pointer;
}
.bk {
  position: absolute; top: 0; height: 60%; width: var(--bw); z-index: 2; background: var(--key-black);
  border-radius: 0 0 5px 5px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
  padding-bottom: 5px; font: 10px var(--body); color: #9aa2b5; cursor: pointer;
}
.wk.down, .bk.down { background: var(--accent); color: var(--accent-fg); }
.wk.cap::before, .bk.cap::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); margin-bottom: 4px; }
.wk.cap.down::before, .bk.cap.down::before { background: var(--accent-fg); }
.kl { display: none; font-weight: 600; }
@media (hover: hover) and (pointer: fine) { .kl { display: block; } }
.cn { font-weight: 600; }
.credit { font-size: 12px; color: var(--muted); text-align: center; }
#inputPanel.compact .clock, #inputPanel.compact .ops { display: none; }
.keys-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.keys-head h2 { margin-right: auto; }
.keys { width: 100%; }
.keys td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.keys tr:last-child td { border-bottom: 0; }
.keys td.op { font: 600 14px var(--mono); width: 1%; white-space: nowrap; }
.keys td.op small { display: block; font: 500 11.5px var(--body); color: var(--muted); }
.keys td.kn { font: 600 19px/1.3 var(--body); letter-spacing: 0.02em; }
.keys td.kn small { display: block; font: 400 12.5px var(--mono); color: var(--muted); letter-spacing: 0; }
.keys td.kp { width: 1%; text-align: right; }
.keys tr.orig td { background: var(--accent-soft); }
.keys tr.orig td.op { box-shadow: inset 3px 0 0 var(--accent); }
.copybox { width: 100%; min-height: 160px; font: 13px var(--mono); border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); padding: 8px; }
.compare-out { font-size: 14.5px; display: grid; gap: 6px; }
.compare-out p { margin: 0; }

.mx-tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.mx { border-collapse: separate; border-spacing: 2px; margin: 0 auto; table-layout: fixed; width: 100%; max-width: 540px; }
.mx th, .mx td { padding: 0; text-align: center; }
.mx td button, .mx th button { width: 100%; min-width: 20px; height: 30px; border: 0; border-radius: 6px; font: 13px var(--mono); font-variant-numeric: tabular-nums; padding: 0; }
.mx td button { background: var(--bg); }
.mx td button:hover { box-shadow: inset 0 0 0 1.5px var(--accent); }
.mx td.sel button { background: var(--accent); color: var(--accent-fg); }
.mx td.first button { font-weight: 600; }
.mx th button { background: none; font: 600 10px var(--body); color: var(--muted); letter-spacing: -0.02em; }
@media (max-width: 420px) { .mx td button { font-size: 12px; height: 27px; } .mx th button { font-size: 9px; } }
.mx th button:hover { color: var(--accent); }
.mx-sel { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); min-height: 52px; }
.mx-sel .mono { font-size: 15px; }
.mx-sel b { color: var(--accent); font-family: var(--display); font-size: 18px; }

.cat-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.cat-tools input { flex: 1 1 180px; font: 14px var(--body); padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.cards { display: flex; flex-wrap: wrap; gap: 4px; }
.cards button { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 4px 9px; font: 13px var(--mono); }
.cards button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.cat-wrap { overflow: auto; max-height: 560px; border: 1px solid var(--line); border-radius: 10px; }
.cat { width: 100%; }
.cat th, .cat td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.cat th { position: sticky; top: 0; background: var(--surface); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; z-index: 1; }
.cat td { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.cat tbody tr { cursor: pointer; }
.cat tbody tr:hover, .cat tbody tr.current { background: var(--accent-soft); }
.cat td.nm { font-weight: 500; color: var(--accent); }
.diff { color: var(--warn); font-size: 11px; font-family: var(--body); margin-left: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>Forte Set Finder<small>Post-tonal toolkit · Forte prime forms</small></h1>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="label">10 / 11 as</span>
      <div class="seg" role="group" aria-label="How to write 10 and 11" id="notation">
        <button type="button" data-n="te" aria-pressed="true">T E</button>
        <button type="button" data-n="ab" aria-pressed="false">A B</button>
        <button type="button" data-n="num" aria-pressed="false">10 11</button>
      </div>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Tools" id="tabs">
    <button type="button" role="tab" data-tab="set" aria-selected="true">Set</button>
    <button type="button" role="tab" data-tab="sub" aria-selected="false">Subsets</button>
    <button type="button" role="tab" data-tab="forms" aria-selected="false">Tn/TnI</button>
    <button type="button" role="tab" data-tab="keys" aria-selected="false">Transpose</button>
    <button type="button" role="tab" data-tab="matrix" aria-selected="false">Matrix</button>
    <button type="button" role="tab" data-tab="list" aria-selected="false">List</button>
  </nav>

  <div class="main" id="main">
    <section class="panel piano-panel" id="pianoPanel" aria-label="Piano">
      <div class="piano-bar">
        <div class="hold" id="hold" role="status">
          <div class="hold-text" id="holdText"></div>
          <div class="meter"><i id="holdMeter"></i></div>
        </div>
        <div class="piano-tools">
          <button type="button" class="oct" id="octDown" aria-label="Octave down">◀</button>
          <span class="oct-label" id="octLabel"></span>
          <button type="button" class="oct" id="octUp" aria-label="Octave up">▶</button>
          <button type="button" class="chip" id="latch" aria-pressed="false">Latch</button>
          <button type="button" class="chip" id="pianoReset">Reset</button>
        </div>
      </div>
      <div class="piano" id="piano"></div>
    </section>

    <section class="panel" id="inputPanel" aria-label="Enter a set">
      <div class="entry">
        <label class="label" for="pcs">Notes or pitch classes</label>
        <div class="entry-row">
          <input id="pcs" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="G B D F  or  0 1 4 6" value="G B D F">
          <button type="button" class="play" id="play" aria-label="Play these notes">▶ Play</button>
        </div>
        <p class="err" id="err" role="status"></p>
      </div>
      <svg class="clock" id="clock" viewBox="0 0 300 300" role="group" aria-label="Pitch-class clock"></svg>
      <div class="ops" id="ops">
        <button class="chip" data-op="t-1" type="button">T−1</button>
        <button class="chip" data-op="t1" type="button">T+1</button>
        <button class="chip" data-op="i0" type="button">T0I</button>
        <button class="chip" data-op="m5" type="button">M5</button>
        <button class="chip" data-op="comp" type="button">Complement</button>
        <button class="chip" data-op="prime" type="button">Prime</button>
        <button class="chip ghost" data-op="clear" type="button">Clear</button>
      </div>
    </section>

    <section class="panel" role="tabpanel" data-panel="set" id="setPanel" aria-live="polite"></section>
    <section class="panel" role="tabpanel" data-panel="sub" id="subPanel" hidden></section>
    <section class="panel" role="tabpanel" data-panel="forms" hidden>
      <div id="formsOut"></div>
      <div class="entry">
        <label class="label" for="pcs2">Compare with</label>
        <input id="pcs2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="C Eb G Bb">
      </div>
      <div class="compare-out" id="compare"></div>
    </section>

    <section class="panel" role="tabpanel" data-panel="keys" hidden id="keysOut"></section>

    <section class="panel" role="tabpanel" data-panel="matrix" hidden>
      <div class="entry">
        <label class="label" for="row">Row</label>
        <div class="entry-row">
          <input id="row" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="G Bb D F# A C E G# B C# Eb F">
          <button type="button" class="chip" id="useSet">Use PC Set</button>
        </div>
        <p class="err" id="rowErr" role="status"></p>
      </div>
      <div class="mx-tools">
        <div class="seg" role="group" aria-label="Matrix labels" id="mxLabels">
          <button type="button" data-v="fixed" aria-pressed="true">P = first pc</button>
          <button type="button" data-v="movable" aria-pressed="false">P0 = row</button>
        </div>
        <div class="seg" role="group" aria-label="Show matrix as" id="mxShow">
          <button type="button" data-v="num" aria-pressed="true">0–11</button>
          <button type="button" data-v="notes" aria-pressed="false">Notes</button>
        </div>
      </div>
      <div class="scroll" style="border:0"><table class="mx" id="mx"></table></div>
      <div class="mx-sel" id="mxSel"></div>
    </section>

    <section class="panel" role="tabpanel" data-panel="list" hidden>
      <div class="cat-tools">
        <h2>Forte's set classes</h2>
        <input id="search" type="search" placeholder="Search 4-Z15, 0146, 111111">
      </div>
      <div class="cards" id="cards" role="group" aria-label="Cardinality"></div>
      <div class="cat-wrap">
        <table class="cat">
          <thead><tr><th>Name</th><th>Prime form</th><th>IC vector</th><th>Z</th><th>Complement</th><th>M</th><th>Invariance</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>
  <p class="credit">Piano sound: Salamander Grand Piano by Alexander Holm (CC BY 3.0)</p>
</div>

<script src="forte.js"></script>
<script>
(() => {
  const F = window.Forte;
  const $ = (id) => document.getElementById(id);
  const RAHN_DIFF = new Set(['5-20', '6-Z29', '6-31', '7-Z18', '7-20', '8-26']);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const TABS = ['set', 'sub', 'forms', 'keys', 'matrix', 'list'];

  let notation = store.get('notation') || 'te';
  let tab = TABS.includes(store.get('tab')) ? store.get('tab') : 'set';
  let current = [];
  let tokens = [];
  let inputStyle = 'notes';
  let card = 4;
  let keysSort = store.get('keysSort') === 'pitch' ? 'pitch' : 'tn';
  let mxLabels = store.get('mxLabels') === 'movable' ? 'movable' : 'fixed';
  let mxShow = store.get('mxShow') === 'notes' ? 'notes' : 'num';
  let mxSel = [];      // selected matrix cells, in the order chosen: [[row, col], ...]
  let mxSelName = '';  // e.g. "P5" when a whole row form was picked

  const pc = (x) => x < 10 || x > 11 ? String(x) : notation === 'te' ? 'TE'[x - 10] : notation === 'ab' ? 'AB'[x - 10] : String(x);
  // Compact "[0146]" when every pc is one character, otherwise comma separated.
  const fmt = (pcs, br = '[]') => {
    const parts = pcs.map(pc);
    return br[0] + parts.join(parts.some((p) => p.length > 1) ? ',' : '') + br[1];
  };
  const vec = (v) => '<' + v.join('') + '>';
  const NAMES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
  // Spellings the parser reads back, used when the user is typing note names.
  const SPELL = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
  const notesOf = (pcs) => pcs.map((x) => NAMES[x]).join(' ');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const writeSet = (pcs) => pcs.map((x) => inputStyle === 'notes' ? SPELL[x] : pc(x)).join(' ');
  const sortU = (a) => [...new Set(a.map(F.mod12))].sort((x, y) => x - y);
  const scButton = (e, extra = '') => `<button type="button" class="sc" data-load="${e.key}"><b>${e.name}</b>${e.card ? fmt(e.prime, '()') : '( )'}${extra}</button>`;
  const link = (e) => e ? `<button type="button" class="linkish" data-load="${e.key}">${e.name}</button>` : '—';

  function setInput(pcs, order) {
    current = sortU(pcs);
    $('pcs').value = writeSet(order || current);
    tokens = F.parseTokens($('pcs').value);
    $('err').textContent = '';
    renderActive();
  }
  function readInput() {
    const v = $('pcs').value;
    tokens = F.parseTokens(v);
    if (v.trim()) inputStyle = /\d/.test(v) ? 'numbers' : 'notes';
    current = sortU(tokens.map((t) => t.pc));
  }

  // ---- tabs ----
  function showTab(t) {
    tab = t;
    store.set('tab', t);
    $('tabs').querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-selected', b.dataset.tab === t));
    document.querySelectorAll('[data-panel]').forEach((p) => { p.hidden = p.dataset.panel !== t; });
    const solo = t === 'matrix' || t === 'list';
    $('inputPanel').hidden = solo;
    $('pianoPanel').hidden = solo;
    $('main').classList.toggle('solo', solo);
    $('inputPanel').classList.toggle('compact', t === 'keys');
    renderActive();
  }
  $('tabs').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-tab]');
    if (b) showTab(b.dataset.tab);
  });

  function renderActive() {
    drawClock();
    $('play').disabled = !current.length;
    if (tab === 'set') renderSet();
    else if (tab === 'sub') renderSub();
    else if (tab === 'forms') { renderForms(); renderCompare(); }
    else if (tab === 'keys') renderKeys();
    else if (tab === 'matrix') renderMatrix();
    else renderTable();
  }

  // Anything carrying data-load (a set class) or data-set (literal pcs) opens it in the PC Set tab.
  document.addEventListener('click', (ev) => {
    const l = ev.target.closest('[data-load]');
    const s = ev.target.closest('[data-set]');
    if (l) { setInput(F.byPrime[l.dataset.load].prime); showTab('set'); }
    else if (s) { setInput(s.dataset.set ? s.dataset.set.split(',').map(Number) : []); showTab('set'); }
    else return;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ---- clock ----
  const clock = $('clock');
  const R = 112, C = 150;
  const pos = (i, r = R) => [C + r * Math.sin((i * Math.PI) / 6), C - r * Math.cos((i * Math.PI) / 6)];
  clock.innerHTML = `<circle class="ring" cx="${C}" cy="${C}" r="${R}"></circle><polygon class="poly" id="poly" points=""></polygon>` +
    [...Array(12).keys()].map((i) => { const [x, y] = pos(i, 141); return `<text class="nname" x="${x}" y="${y}">${NAMES[i]}</text>`; }).join('') +
    [...Array(12).keys()].map((i) => {
      const [x, y] = pos(i);
      return `<g class="node" data-pc="${i}" tabindex="0" role="button" aria-label="Pitch class ${i} (${NAMES[i]})"><circle cx="${x}" cy="${y}" r="19"></circle><text x="${x}" y="${y}" id="nodelabel${i}">${i}</text></g>`;
    }).join('');
  const toggle = (i) => {
    const order = tokens.map((t) => t.pc);
    setInput(current.includes(i) ? current.filter((x) => x !== i) : [...current, i],
      current.includes(i) ? order.filter((x) => x !== i) : [...order, i]);
  };
  clock.addEventListener('click', (e) => { const g = e.target.closest('.node'); if (g) toggle(+g.dataset.pc); });
  clock.addEventListener('keydown', (e) => {
    const g = e.target.closest('.node');
    if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggle(+g.dataset.pc); }
  });
  function drawClock() {
    clock.querySelectorAll('.node').forEach((g) => {
      const i = +g.dataset.pc;
      g.classList.toggle('on', current.includes(i));
      g.setAttribute('aria-pressed', current.includes(i));
      $('nodelabel' + i).textContent = pc(i);
    });
    $('poly').setAttribute('points', current.length > 1 ? current.map((i) => pos(i).join(',')).join(' ') : '');
  }

  // ---- input ----
  $('pcs').addEventListener('input', () => {
    try {
      readInput();
      $('err').textContent = '';
      renderActive();
    } catch (err) {
      $('err').textContent = err.message;
    }
  });
  $('ops').addEventListener('click', (ev) => {
    const op = ev.target.closest('[data-op]')?.dataset.op;
    if (!op) return;
    const order = tokens.map((t) => t.pc);
    const ordered = {
      't-1': () => F.transpose(order, -1),
      t1: () => F.transpose(order, 1),
      i0: () => F.invert(order, 0),
      m5: () => F.multiply(order, 5),
    }[op];
    if (ordered) { const o = ordered(); setInput(o, o); return; }
    setInput({ comp: () => F.complement(current), prime: () => F.primeForm(current), clear: () => [] }[op]());
  });

  // ---- PC Set tab ----
  function relCard(title, pcs) {
    if (!pcs.length) return `<div class="rel"><div class="label">${title}</div><p class="muted">Empty set</p></div>`;
    const id = F.identify(pcs), e = id.entry;
    return `<div class="rel">
      <div class="rel-head"><div class="label">${title}</div><button type="button" class="chip" data-set="${id.pcs.join(',')}">Open</button></div>
      <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap"><span class="rel-name">${e.name}</span><span class="mono">${notesOf(id.pcs)}</span></div>
      <dl class="facts">
        <div><dt>Normal form</dt><dd>${fmt(id.normal)}</dd></div>
        <div><dt>Prime form</dt><dd>${fmt(e.prime, '()')}</dd></div>
        <div><dt>IC vector</dt><dd>${vec(e.vector)}</dd></div>
        <div><dt>Z-mate</dt><dd>${e.zPartner ? e.zPartner.name : '—'}</dd></div>
      </dl>
    </div>`;
  }

  function renderSet() {
    const out = $('setPanel');
    if (!current.length) { out.innerHTML = `<p class="muted">Type notes or tap the clock.</p>`; return; }
    const id = F.identify(current), e = id.entry, sym = F.symmetries(current);
    out.innerHTML = `
      <div class="result-head">
        <div class="forte-name">${e.name}</div>
        <div style="display:grid;gap:4px">
          <div class="prime-big">${fmt(e.prime, '()')}</div>
          <div>${e.zPartner ? `<span class="tag">Z-mate ${e.zPartner.name}</span> ` : ''}${RAHN_DIFF.has(e.name) ? `<span class="tag" title="Rahn's method gives a different prime form">Forte ≠ Rahn</span>` : ''}</div>
        </div>
      </div>
      <dl class="facts">
        <div><dt>Normal form</dt><dd>${fmt(id.normal)}</dd></div>
        <div><dt>Prime form</dt><dd>${fmt(e.prime, '()')}</dd></div>
        <div><dt>Notes</dt><dd style="font-family:var(--body)">${notesOf(id.pcs)}</dd></div>
        <div><dt>From prime</dt><dd>${id.ops.join(', ')}</dd></div>
        <div class="wide"><dt>Interval-class vector</dt><dd><div class="icv">${e.vector.map((n, i) => `<span><b>${n}</b><i>ic${i + 1}</i></span>`).join('')}</div></dd></div>
        <div><dt>Z-mate</dt><dd>${link(e.zPartner)}</dd></div>
        <div><dt>Complement</dt><dd>${link(e.complement)}</dd></div>
        <div><dt>M5 partner</dt><dd>${link(e.mPartner)}</dd></div>
        <div><dt>Distinct forms</dt><dd>${24 / (sym.tn.length + sym.tni.length)} <span class="sub">of 24</span></dd></div>
        <div><dt>Tn invariance</dt><dd>${sym.tn.map((n) => 'T' + n).join(', ')} <span class="sub">(${sym.tn.length})</span></dd></div>
        <div><dt>TnI invariance</dt><dd>${sym.tni.length ? sym.tni.map((n) => `T${n}I`).join(', ') : 'none'} <span class="sub">(${sym.tni.length})</span></dd></div>
        <div><dt>Invariance vector</dt><dd>(${e.invariance.join('')})</dd></div>
        <div><dt>Interval succession</dt><dd>${fmt(id.normal.map((x, i, a) => i ? F.mod12(x - a[i - 1]) : null).slice(1), '<>')}</dd></div>
      </dl>
      <div class="related">
        ${relCard('Inversion (T0I)', F.invert(current, 0))}
        ${relCard('Complement', F.complement(current))}
      </div>`;
  }

  // ---- Subsets tab ----
  function renderSub() {
    const out = $('subPanel');
    if (!current.length) { out.innerHTML = `<p class="muted">Type notes or tap the clock.</p>`; return; }
    const e = F.identify(current).entry;
    const byCard = (items, get) => {
      const m = new Map();
      for (const it of items) { const c = get(it).card; if (!m.has(c)) m.set(c, []); m.get(c).push(it); }
      return [...m];
    };
    const subs = byCard(F.subsetClasses(current), (x) => x.entry);
    const sups = byCard(F.supersetClasses(current), (x) => x);
    const subHtml = subs.length ? subs.map(([c, items]) => `
      <div class="group">
        <div class="group-title"><h3>${c} notes</h3><span class="label">${items.length} set class${items.length > 1 ? 'es' : ''}</span></div>
        <div class="sclist">${items.map((x) => scButton(x.entry, `<i>×${x.count}</i>`)).join('')}</div>
      </div>`).join('') : `<p class="muted">No subsets with 2 or more notes.</p>`;
    const supHtml = sups.length ? sups.map(([c, items], k) => `
      <details class="group"${k < 2 ? ' open' : ''}>
        <summary><h3 style="display:inline">${c} notes</h3> <span class="label">${items.length} set class${items.length > 1 ? 'es' : ''}</span></summary>
        <div class="sclist">${items.map((x) => scButton(x)).join('')}</div>
      </details>`).join('') : `<p class="muted">No larger set classes.</p>`;
    out.innerHTML = `
      <h2>Subsets of ${e.name} ${fmt(e.prime, '()')}</h2>
      <p class="muted" style="font-size:13px">×n = how many times it occurs in ${fmt(current, '{}')}</p>
      ${subHtml}
      <h2 style="margin-top:8px">Supersets</h2>
      ${supHtml}`;
  }

  // ---- Tn / TnI tab ----
  function renderForms() {
    const out = $('formsOut');
    if (!current.length) { out.innerHTML = `<p class="muted">Type notes or tap the clock.</p>`; return; }
    const fs = F.forms(current), cur = F.key(current);
    const cell = (f) => {
      const nf = F.normalForm(f.pcs);
      return `<td class="f${F.key(f.pcs) === cur ? ' same' : ''}" data-set="${f.pcs.join(',')}">${fmt(nf)}<small>${notesOf(nf)}</small></td>`;
    };
    out.innerHTML = `
      <h2 style="margin-bottom:10px">All forms of ${fmt(current, '{}')}</h2>
      <div class="scroll"><table class="forms">
        <thead><tr><th></th><th>Tn</th><th></th><th>TnI</th></tr></thead>
        <tbody>${[...Array(12).keys()].map((n) => `<tr><td class="op">T${n}</td>${cell(fs[n])}<td class="op">T${n}I</td>${cell(fs[12 + n])}</tr>`).join('')}</tbody>
      </table></div>`;
  }

  function renderCompare() {
    const out = $('compare');
    let b;
    try { b = F.parse($('pcs2').value); } catch (err) { out.innerHTML = `<p class="err">${esc(err.message)}</p>`; return; }
    const a = current;
    if (!a.length || !b.length) { out.innerHTML = ''; return; }
    const ea = F.identify(a).entry, eb = F.identify(b).entry;
    const lines = [`<p><span class="mono">${fmt(a, '{}')}</span> is <b>${ea.name}</b>; <span class="mono">${fmt(b, '{}')}</span> is <b>${eb.name}</b>.</p>`];
    const ops = F.relate(a, b);
    if (ops.length) lines.push(`<p>Same set class: <b class="mono">${ops.join(', ')}</b> maps the first onto the second.</p>`);
    else if (ea.zPartner === eb) lines.push(`<p>Z-related: same IC vector <span class="mono">${vec(ea.vector)}</span>.</p>`);
    else if (ea.complement === eb && ea.card + eb.card === 12) lines.push(`<p>Complementary set classes.</p>`);
    else lines.push(`<p>Different set classes.</p>`);
    if (ea.card !== eb.card) {
      const [s, l, sn, ln] = ea.card < eb.card ? [a, b, 'First', 'second'] : [b, a, 'Second', 'first'];
      const abs = F.abstractInclusion(s, l);
      if (s.every((x) => l.includes(x))) lines.push(`<p>${sn} set is a literal subset of the ${ln}.</p>`);
      else if (abs) lines.push(`<p>${sn} set's class is a subset class of the ${ln} (via ${abs}).</p>`);
      else lines.push(`<p>${sn} set's class is not a subset of the ${ln}.</p>`);
    }
    const common = a.filter((x) => b.includes(x));
    lines.push(`<p>Common tones: <span class="mono">${common.length ? fmt(common, '{}') : 'none'}</span></p>`);
    out.innerHTML = lines.join('');
  }
  $('pcs2').addEventListener('input', renderCompare);

  // ---- Transpose tab ----
  // Every transposition in the order the notes were typed, repeats included.
  function transpositions() {
    const rows = F.spelledTranspositions(tokens);
    return keysSort === 'pitch' ? [...rows].sort((a, b) => a.pcs[0] - b.pcs[0]) : rows;
  }
  const keyLabel = (t) => t.n ? `up ${F.intervalName(t.n, t.letterSteps)}` : 'original';

  function renderKeys() {
    const out = $('keysOut');
    if (!tokens.length) { out.innerHTML = `<p class="muted">Type notes or tap the clock.</p>`; return; }
    const rows = transpositions();
    out.innerHTML = `
      <div class="keys-head">
        <h2>All 12 transpositions</h2>
        <div class="seg" role="group" aria-label="Order" id="keysSort">
          <button type="button" data-v="tn" aria-pressed="${keysSort === 'tn'}">T0–T11</button>
          <button type="button" data-v="pitch" aria-pressed="${keysSort === 'pitch'}">C to B</button>
        </div>
        <button type="button" class="chip" id="keysCopy">Copy all</button>
      </div>
      <div class="scroll"><table class="keys"><tbody>
        ${rows.map((t) => `<tr class="${t.n === 0 ? 'orig' : ''}">
          <td class="op">T${t.n}<small>${keyLabel(t)}</small></td>
          <td class="kn">${t.names.join(' ')}<small>${t.pcs.map(pc).join(' ')}</small></td>
          <td class="kp"><button type="button" class="chip" data-play="${t.n}" aria-label="Play T${t.n}">▶</button></td>
        </tr>`).join('')}
      </tbody></table></div>
      <div id="keysMsg"></div>`;
  }

  $('keysOut').addEventListener('click', (ev) => {
    const sortBtn = ev.target.closest('#keysSort [data-v]');
    const playBtn = ev.target.closest('[data-play]');
    if (sortBtn) {
      keysSort = sortBtn.dataset.v;
      store.set('keysSort', keysSort);
      renderKeys();
    } else if (playBtn) {
      play(F.spelledTranspositions(tokens)[+playBtn.dataset.play].pcs);
    } else if (ev.target.closest('#keysCopy')) {
      const text = transpositions().map((t) => `T${t.n} (${keyLabel(t)}): ${t.names.join(' ')}`).join('\n');
      const showBox = () => {
        $('keysMsg').innerHTML = `<p class="muted" style="font-size:13px">Copy from here:</p><textarea class="copybox" readonly id="keysText"></textarea>`;
        $('keysText').value = text;
        $('keysText').select();
      };
      try {
        navigator.clipboard.writeText(text).then(
          () => { $('keysMsg').innerHTML = '<p class="muted" style="font-size:13px">Copied all 12.</p>'; },
          showBox);
      } catch { showBox(); }
    }
  });

  // ---- Matrix tab ----
  function readRow() {
    const toks = F.parseTokens($('row').value);
    const seen = new Map();
    for (const t of toks) {
      if (seen.has(t.pc)) throw new Error(`${t.label} repeats ${seen.get(t.pc)}. Each pitch class can appear once in a row.`);
      seen.set(t.pc, t.label);
    }
    return toks.map((t) => t.pc);
  }

  function renderMatrix() {
    let row;
    try { row = readRow(); $('rowErr').textContent = ''; } catch (err) { $('rowErr').textContent = err.message; return; }
    $('mxLabels').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === mxLabels));
    $('mxShow').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === mxShow));
    const table = $('mx');
    if (!row.length) { table.innerHTML = ''; $('mxSel').innerHTML = '<span class="muted">Enter a row.</span>'; return; }
    const M = F.matrix(row), n = row.length;
    const lab = (x) => mxLabels === 'fixed' ? x : F.mod12(x - row[0]);
    const show = (x) => mxShow === 'notes' ? NAMES[x] : pc(x);
    const selKeys = new Set(mxSel.map(([i, j]) => i + ',' + j));
    const hb = (line, text) => `<th><button type="button" data-line="${line}" aria-label="Select ${text}">${text}</button></th>`;
    table.innerHTML =
      `<thead><tr><th></th>${M[0].map((x, j) => hb('I:' + j, 'I' + lab(x))).join('')}<th></th></tr></thead>` +
      `<tbody>${M.map((r, i) => `<tr>${hb('P:' + i, 'P' + lab(r[0]))}${r.map((x, j) =>
        `<td class="${selKeys.has(i + ',' + j) ? 'sel' : ''}${i === 0 ? ' first' : ''}"><button type="button" data-cell="${i},${j}">${show(x)}</button></td>`).join('')}${hb('R:' + i, 'R' + lab(r[0]))}</tr>`).join('')}</tbody>` +
      `<tfoot><tr><th></th>${M[0].map((x, j) => hb('RI:' + j, 'RI' + lab(x))).join('')}<th></th></tr></tfoot>`;
    renderMxSel(M);
  }

  function renderMxSel(M) {
    const out = $('mxSel');
    if (!mxSel.length) { out.innerHTML = '<span class="muted">Tap cells or a row label to pick a segment.</span>'; return; }
    const ordered = mxSel.map(([i, j]) => M[i][j]);
    const e = F.identify(ordered).entry;
    out.innerHTML = `
      ${mxSelName ? `<span class="label">${mxSelName}</span>` : ''}
      <span class="mono">${ordered.map((x) => mxShow === 'notes' ? NAMES[x] : pc(x)).join(' ')}</span>
      <span>→ <b>${e.name}</b> <span class="mono">${fmt(e.prime, '()')}</span></span>
      <span style="display:flex;gap:6px;margin-left:auto">
        <button type="button" class="chip" id="mxPlay">▶ Play</button>
        <button type="button" class="chip" id="mxOpen">Open in PC Set</button>
        <button type="button" class="chip ghost" id="mxClear">Clear</button>
      </span>`;
    $('mxPlay').onclick = () => play(ordered);
    $('mxOpen').onclick = () => { inputStyle = mxShow === 'notes' ? 'notes' : inputStyle; setInput(ordered, [...new Set(ordered)]); showTab('set'); };
    $('mxClear').onclick = () => { mxSel = []; mxSelName = ''; renderMatrix(); };
  }

  $('mx').addEventListener('click', (ev) => {
    let row;
    try { row = readRow(); } catch { return; }
    const n = row.length;
    const cellBtn = ev.target.closest('[data-cell]');
    const lineBtn = ev.target.closest('[data-line]');
    if (cellBtn) {
      const [i, j] = cellBtn.dataset.cell.split(',').map(Number);
      if (mxSelName) mxSel = []; // a tap after picking a whole row form starts a new segment
      const k = mxSel.findIndex(([a, b]) => a === i && b === j);
      if (k >= 0) mxSel.splice(k, 1); else mxSel.push([i, j]);
      mxSelName = '';
    } else if (lineBtn) {
      const [kind, idx] = lineBtn.dataset.line.split(':');
      const x = +idx, fwd = [...Array(n).keys()], back = [...fwd].reverse();
      mxSel = {
        P: fwd.map((j) => [x, j]), R: back.map((j) => [x, j]),
        I: fwd.map((i) => [i, x]), RI: back.map((i) => [i, x]),
      }[kind];
      mxSelName = lineBtn.textContent;
    } else return;
    renderMatrix();
  });
  $('row').addEventListener('input', () => { mxSel = []; mxSelName = ''; renderMatrix(); });
  $('useSet').addEventListener('click', () => {
    if (!current.length) return;
    $('row').value = writeSet([...new Set(tokens.map((t) => t.pc))]);
    mxSel = []; mxSelName = '';
    renderMatrix();
  });
  $('mxLabels').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-v]'); if (!b) return;
    mxLabels = b.dataset.v; store.set('mxLabels', mxLabels); mxSelName = ''; renderMatrix();
  });
  $('mxShow').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-v]'); if (!b) return;
    mxShow = b.dataset.v; store.set('mxShow', mxShow); renderMatrix();
  });

  // ---- Set list tab ----
  $('cards').innerHTML = `<button type="button" data-c="all" aria-pressed="false">All</button>` +
    [...Array(13).keys()].map((c) => `<button type="button" data-c="${c}" aria-pressed="${c === card}">${c}</button>`).join('');
  $('cards').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-c]');
    if (!b) return;
    card = b.dataset.c === 'all' ? 'all' : +b.dataset.c;
    $('cards').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    renderTable();
  });
  $('search').addEventListener('input', renderTable);

  function renderTable() {
    const q = $('search').value.trim().toLowerCase().replace(/[\s,()[\]<>{}]/g, '');
    const rows = F.list.filter((e) => {
      if (q) {
        const hay = [e.name.toLowerCase(), e.name.toLowerCase().replace('z', ''), e.key, e.prime.map(pc).join('').toLowerCase(), e.vector.join('')];
        return hay.some((h) => h.includes(q));
      }
      return card === 'all' || e.card === card;
    });
    const curKey = current.length ? F.key(F.primeForm(current)) : null;
    $('rows').innerHTML = rows.map((e) => `
      <tr data-load="${e.key}" class="${e.key === curKey ? 'current' : ''}">
        <td class="nm">${e.name}${RAHN_DIFF.has(e.name) ? '<span class="diff" title="Rahn\'s method gives a different prime form">≠ Rahn</span>' : ''}</td>
        <td>${e.card ? fmt(e.prime) : '[ ]'}</td>
        <td>${vec(e.vector)}</td>
        <td>${e.zPartner ? e.zPartner.name : ''}</td>
        <td>${e.complement.name}</td>
        <td>${e.mPartner.name}</td>
        <td>(${e.invariance.join('')})</td>
      </tr>`).join('') || `<tr><td colspan="7" style="font-family:var(--body);color:var(--muted)">No set class matches “${esc($('search').value)}”.</td></tr>`;
  }

  // ---- notation ----
  function applyNotation() {
    $('notation').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.n === notation));
    if (inputStyle === 'numbers' && current.length) $('pcs').value = writeSet(tokens.map((t) => t.pc));
    renderActive();
  }
  $('notation').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-n]');
    if (!b) return;
    notation = b.dataset.n;
    store.set('notation', notation);
    applyNotation();
  });

  // ---- piano sound ----
  // Salamander Grand Piano samples every minor third from C2 to C7; each note uses the nearest.
  const SAMPLES = [];
  for (let o = 2; o <= 6; o++) ['C', 'Ds', 'Fs', 'A'].forEach((n, i) => SAMPLES.push({ midi: 12 * (o + 1) + i * 3, file: `piano/${n}${o}.mp3` }));
  SAMPLES.push({ midi: 96, file: 'piano/C7.mp3' });
  let audio, out, decoder;
  const decoded = new Map();  // sample midi -> AudioBuffer
  const loading = new Map();  // sample midi -> Promise<AudioBuffer | null>
  function ctx() {
    if (!audio) {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      out = audio.createDynamicsCompressor();
      out.connect(audio.destination);
    }
    if (audio.state === 'suspended') audio.resume();
    return audio;
  }
  const nearest = (m) => SAMPLES.reduce((a, b) => Math.abs(b.midi - m) < Math.abs(a.midi - m) ? b : a);
  function loadSample(s) {
    // Opened as a local file, the browser refuses to fetch the samples; the synth stands in.
    if (location.protocol === 'file:') return Promise.resolve(null);
    if (!loading.has(s.midi)) {
      loading.set(s.midi, fetch(s.file)
        .then((r) => { if (!r.ok) throw new Error(String(r.status)); return r.arrayBuffer(); })
        .then((buf) => {
          // Decode offline so samples can load before the first tap starts real audio.
          decoder = decoder || new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(2, 1, 44100);
          return new Promise((res, rej) => decoder.decodeAudioData(buf, res, rej));
        })
        .then((b) => { decoded.set(s.midi, b); return b; })
        .catch(() => null));
    }
    return loading.get(s.midi);
  }
  const preload = (midis) => Promise.all([...new Set(midis.map(nearest))].map(loadSample));

  // Starts a note now (or at `when`) and returns a function that releases it.
  function noteOn(m, when, velocity = 0.8) {
    const a = ctx(), t = when ?? a.currentTime;
    const g = a.createGain();
    g.connect(out);
    const s = nearest(m), buf = decoded.get(s.midi);
    let node;
    if (buf) {
      node = a.createBufferSource();
      node.buffer = buf;
      node.playbackRate.value = 2 ** ((m - s.midi) / 12);
      g.gain.setValueAtTime(velocity, t);
    } else {
      // Sample still loading: a soft synth note stands in.
      loadSample(s);
      node = a.createOscillator();
      node.type = 'triangle';
      node.frequency.value = 440 * 2 ** ((m - 69) / 12);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.25 * velocity, t + 0.01);
      g.gain.setTargetAtTime(0, t + 0.01, 0.8);
    }
    node.connect(g);
    node.start(t);
    return (at) => {
      const r = Math.max(at ?? a.currentTime, t);
      g.gain.cancelScheduledValues(r);
      g.gain.setTargetAtTime(0, r, 0.09);
      node.stop(r + 0.8);
    };
  }

  // Plays the notes in order, each at or above the one before, then together as a chord.
  async function play(order) {
    if (!order.length) return;
    try { ctx(); } catch { return; }
    let prev = -Infinity;
    const midi = order.map((p) => { let m = 60 + p; while (m < prev) m += 12; prev = m; return m; });
    while (midi[midi.length - 1] > 84 && midi[0] > 48) for (let i = 0; i < midi.length; i++) midi[i] -= 12;
    await Promise.race([preload(midi), new Promise((r) => setTimeout(r, 1500))]);
    const t0 = audio.currentTime + 0.05, step = 0.32;
    midi.forEach((m, i) => noteOn(m, t0 + i * step, 0.7)(t0 + i * step + 0.6));
    const chordAt = t0 + midi.length * step + 0.15, chord = [...new Set(midi)];
    chord.forEach((m) => noteOn(m, chordAt, 0.9 / Math.sqrt(chord.length))(chordAt + 2.4));
  }
  $('play').addEventListener('click', () => play(tokens.length ? [...new Set(tokens.map((t) => t.pc))] : current));

  // ---- piano keyboard ----
  const WHITE = [0, 2, 4, 5, 7, 9, 11];
  // Computer keys, GarageBand style: home row is white keys, the row above is black keys.
  const KEY_CODES = ['KeyA', 'KeyW', 'KeyS', 'KeyE', 'KeyD', 'KeyF', 'KeyT', 'KeyG', 'KeyY', 'KeyH', 'KeyU', 'KeyJ', 'KeyK', 'KeyO', 'KeyL', 'KeyP', 'Semicolon', 'Quote'];
  const KEY_LETTERS = ['A', 'W', 'S', 'E', 'D', 'F', 'T', 'G', 'Y', 'H', 'U', 'J', 'K', 'O', 'L', 'P', ';', "'"];
  const HOLD_MS = 3000;
  const sounding = new Map();   // midi -> { sources: Set, release }
  const pointerNote = new Map(); // pointerId -> midi
  const keyNote = new Map();     // key code -> midi
  let octaves = 2;
  let baseOct = Math.min(5, Math.max(2, +store.get('pianoOct') || 3)); // octave of the leftmost C
  let latch = false;
  let captured = null;           // midis caught by a 3-second hold; kept until Reset
  let holdStart = 0, holdRaf = 0;

  const baseMidi = () => 12 * (baseOct + 1);
  const midiName = (m) => NAMES[m % 12] + (Math.floor(m / 12) - 1);
  const visibleMidis = () => [...Array(12 * octaves).keys()].map((i) => baseMidi() + i);

  function renderPiano() {
    octaves = window.innerWidth >= 900 ? 3 : 2;
    baseOct = Math.min(baseOct, 7 - octaves);
    const lo = baseMidi(), whites = [], blacks = [], wCount = 7 * octaves;
    let wi = 0;
    for (let m = lo; m < lo + 12 * octaves; m++) {
      const letter = KEY_LETTERS[m - lo] ? `<span class="kl">${KEY_LETTERS[m - lo]}</span>` : '';
      if (WHITE.includes(m % 12)) {
        whites.push(`<div class="wk" data-midi="${m}" aria-label="${midiName(m)}">${letter}${m % 12 === 0 ? `<span class="cn">${midiName(m)}</span>` : ''}</div>`);
        wi++;
      } else {
        blacks.push(`<div class="bk" data-midi="${m}" aria-label="${midiName(m)}" style="left:calc(${(wi / wCount) * 100}% - var(--bw) / 2)">${letter}</div>`);
      }
    }
    $('piano').style.setProperty('--bw', `${(100 / wCount) * 0.62}%`);
    $('piano').innerHTML = whites.join('') + blacks.join('');
    $('octLabel').textContent = `C${baseOct}–B${baseOct + octaves - 1}`;
    $('octDown').disabled = baseOct <= 2;
    $('octUp').disabled = baseOct >= 7 - octaves;
    paintKeys();
  }

  function paintKeys() {
    $('piano').querySelectorAll('[data-midi]').forEach((k) => {
      const m = +k.dataset.midi;
      k.classList.toggle('down', sounding.has(m));
      k.classList.toggle('cap', !!captured && captured.includes(m));
    });
  }

  function press(m, src) {
    let s = sounding.get(m);
    if (!s) {
      let release = () => {};
      try { release = noteOn(m); } catch {}
      s = { sources: new Set(), release };
      sounding.set(m, s);
    }
    s.sources.add(src);
    heldChanged();
  }
  function release(m, src) {
    const s = sounding.get(m);
    if (!s) return;
    s.sources.delete(src);
    if (!s.sources.size) { s.release(); sounding.delete(m); }
    heldChanged();
  }
  const toggleLatched = (m) => sounding.get(m)?.sources.has('latch') ? release(m, 'latch') : press(m, 'latch');

  // ---- hold to capture ----
  function heldChanged() {
    paintKeys();
    cancelAnimationFrame(holdRaf);
    holdStart = !captured && sounding.size ? performance.now() : 0;
    renderHold(0);
    if (holdStart) holdRaf = requestAnimationFrame(tickHold);
  }
  function tickHold() {
    if (!holdStart) return;
    const t = performance.now() - holdStart;
    if (t >= HOLD_MS) { capture(); return; }
    renderHold(t);
    holdRaf = requestAnimationFrame(tickHold);
  }
  function capture() {
    holdStart = 0;
    captured = [...sounding.keys()].sort((a, b) => a - b);
    inputStyle = 'notes';
    setInput(captured.map((m) => m % 12), [...new Set(captured.map((m) => m % 12))]);
    renderHold(0);
    paintKeys();
  }
  function renderHold(t) {
    let html, fill;
    if (captured) {
      const e = F.identify(captured.map((m) => m % 12)).entry;
      html = `Captured <b>${e.name}</b> <span class="mono">${fmt(e.prime, '()')}</span> · ${captured.map(midiName).join(' ')}`;
      fill = 1;
    } else if (sounding.size) {
      const ms = [...sounding.keys()].sort((a, b) => a - b);
      html = `${ms.map(midiName).join(' ')} · <b>${F.identify(ms.map((m) => m % 12)).entry.name}</b> · ${((HOLD_MS - t) / 1000).toFixed(1)} s`;
      fill = t / HOLD_MS;
    } else {
      html = '<span class="muted">Hold notes for 3 s to capture the set</span>';
      fill = 0;
    }
    $('holdText').innerHTML = html;
    $('holdMeter').style.width = `${fill * 100}%`;
    $('pianoReset').classList.toggle('primary', !!captured);
  }
  $('pianoReset').addEventListener('click', () => {
    captured = null;
    for (const [m, s] of [...sounding]) if (s.sources.has('latch')) release(m, 'latch');
    setInput([]);
    heldChanged();
  });
  $('latch').addEventListener('click', () => {
    latch = !latch;
    $('latch').setAttribute('aria-pressed', latch);
    if (!latch) for (const [m, s] of [...sounding]) if (s.sources.has('latch')) release(m, 'latch');
  });

  // ---- touch and mouse ----
  const piano = $('piano');
  const keyAt = (x, y) => document.elementFromPoint(x, y)?.closest?.('#piano [data-midi]');
  piano.addEventListener('pointerdown', (e) => {
    const k = e.target.closest('[data-midi]');
    if (!k) return;
    e.preventDefault();
    const m = +k.dataset.midi;
    if (latch) { toggleLatched(m); return; }
    try { piano.setPointerCapture(e.pointerId); } catch {}
    pointerNote.set(e.pointerId, m);
    press(m, 'p' + e.pointerId);
  });
  // Sliding a finger across the keys plays each one it lands on.
  piano.addEventListener('pointermove', (e) => {
    if (!pointerNote.has(e.pointerId)) return;
    const k = keyAt(e.clientX, e.clientY);
    const m = k ? +k.dataset.midi : null, old = pointerNote.get(e.pointerId);
    if (m === old) return;
    if (old !== null) release(old, 'p' + e.pointerId);
    if (m !== null) press(m, 'p' + e.pointerId);
    pointerNote.set(e.pointerId, m);
  });
  const pointerEnd = (e) => {
    if (!pointerNote.has(e.pointerId)) return;
    const m = pointerNote.get(e.pointerId);
    pointerNote.delete(e.pointerId);
    if (m !== null) release(m, 'p' + e.pointerId);
  };
  piano.addEventListener('pointerup', pointerEnd);
  piano.addEventListener('pointercancel', pointerEnd);
  piano.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---- computer keyboard ----
  const typing = (el) => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
  function shiftOct(d) {
    const next = Math.min(7 - octaves, Math.max(2, baseOct + d));
    if (next === baseOct) return;
    baseOct = next;
    store.set('pianoOct', baseOct);
    renderPiano();
    preload(visibleMidis());
  }
  $('octDown').addEventListener('click', () => shiftOct(-1));
  $('octUp').addEventListener('click', () => shiftOct(1));
  window.addEventListener('keydown', (e) => {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey || typing(document.activeElement) || $('pianoPanel').hidden) return;
    if (e.code === 'KeyZ' || e.code === 'KeyX') { e.preventDefault(); shiftOct(e.code === 'KeyZ' ? -1 : 1); return; }
    const i = KEY_CODES.indexOf(e.code);
    if (i < 0) return;
    e.preventDefault();
    const m = baseMidi() + i;
    if (latch) { toggleLatched(m); return; }
    if (keyNote.has(e.code)) return;
    keyNote.set(e.code, m);
    press(m, e.code);
  });
  window.addEventListener('keyup', (e) => {
    if (!keyNote.has(e.code)) return;
    const m = keyNote.get(e.code);
    keyNote.delete(e.code);
    release(m, e.code);
  });
  // Letting go of everything when the window loses focus avoids stuck notes.
  window.addEventListener('blur', () => {
    for (const [code, m] of [...keyNote]) { keyNote.delete(code); release(m, code); }
    for (const [id, m] of [...pointerNote]) { pointerNote.delete(id); if (m !== null) release(m, 'p' + id); }
  });
  let lastOctaves = 0;
  window.addEventListener('resize', () => { if ((window.innerWidth >= 900 ? 3 : 2) !== lastOctaves) { renderPiano(); lastOctaves = octaves; } });

  renderPiano();
  lastOctaves = octaves;
  renderHold(0);
  setTimeout(() => preload(visibleMidis()), 400);

  readInput();
  $('notation').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.n === notation));
  showTab(tab);
})();
</script>
